<ibid-collection-header
  ohsavemeDetectSticky
  [sticky]="isSticky()"
  [compact]="!showTitle && !showTabs"
  [showTitle]="showTitle"
  [title]="'transactions' | translate"
  [showSearch]="showSearch"
  [searchQuery]="searchQuery"
  [searchPlaceholder]="'movementsFilterSearchPlaceholder' | translate"
  [clearLabel]="'searchInputClearLabel' | translate"
  [showTabs]="showTabs"
  [activeTab]="activeTab"
  [tabOptions]="tabOptions"
  (stickyChange)="isSticky.set($event)"
  (searchQueryChange)="searchQueryChange.emit($event)"
  (tabChange)="tabChange.emit($event)"
>
  @if (showSumToggle) {
    <ibid-icon-toggle
      collection-toggle
      [checked]="sumModeEnabled"
      icon="sum"
      [label]="'sumMovementsTitle' | translate"
      [ariaLabel]="'sumMovementsTitle' | translate"
      (checkedChange)="sumModeChange.emit($event)"
    ></ibid-icon-toggle>
  }

  @if (showSort) {
    <div collection-sort class="m-collection-header__controls-end">
      @if (selectionMode || sumModeEnabled) {
        <ibid-sort-button
          [label]="'thSelected' | translate"
          [active]="sortField === 'selected'"
          [direction]="sortField === 'selected' ? sortDirection : 'desc'"
          (clicked)="sortToggle.emit('selected')"
        ></ibid-sort-button>
      }
      <ibid-sort-button
        [label]="'thDate' | translate"
        [active]="sortField === 'date'"
        [direction]="sortField === 'date' ? sortDirection : 'desc'"
        (clicked)="sortToggle.emit('date')"
      ></ibid-sort-button>
      <ibid-sort-button
        [label]="'thAmount' | translate"
        [active]="sortField === 'amount'"
        [direction]="sortField === 'amount' ? sortDirection : 'desc'"
        (clicked)="sortToggle.emit('amount')"
      ></ibid-sort-button>
    </div>
  }
</ibid-collection-header>
