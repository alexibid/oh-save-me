['../node_modules/@codetrix-studio/capacitor-google-auth/android/build.gradle',
 '../../../../node_modules/@codetrix-studio/capacitor-google-auth/android/build.gradle'].each { path ->
    def pluginBuildGradle = file(path)
    if (pluginBuildGradle.exists()) {
        def text = pluginBuildGradle.text
        def modified = false
        if (text.contains('jcenter()')) {
            text = text.replace('jcenter()', 'mavenCentral()')
            modified = true
        }
        if (text.contains("proguard-android.txt")) {
            text = text.replace("proguard-android.txt", "proguard-android-optimize.txt")
            modified = true
        }
        if (modified) {
            pluginBuildGradle.text = text
        }
    }
}


buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
